{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="card card-danger col-md-8 p-0">
  <form method="post">
    {% csrf_token %}
    <div class="card-body">
      <p class="lead">Are you sure you want to delete <strong>{{ object }}</strong>?</p>
      {% if warning %}<div class="alert alert-warning">{{ warning }}</div>{% endif %}
    </div>
    <div class="card-footer">
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{{ back_url }}" class="btn btn-default">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
